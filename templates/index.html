<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>EMA Signal Scanner</title><style>body{margin:0;font-family:Arial;background:#f4f6f8;color:#111827}header{background:#111827;color:#fff;padding:18px}h1{margin:0 0 5px;font-size:22px}.sub{font-size:12px;opacity:.75}.wrap{max-width:900px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}button{background:#111827;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{background:#fff;border-radius:16px;padding:15px;box-shadow:0 3px 14px #0001}.asset{font-size:18px;font-weight:800}.signal{margin:14px 0 10px;padding:10px;border-radius:10px;text-align:center;font-weight:900}.long{background:#dcfce7;color:#166534}.short{background:#fee2e2;color:#991b1b}.wait{background:#eef2f7;color:#475569}.error{background:#fff7ed;color:#9a3412}.unavailable{background:#fff7ed;color:#9a3412}.row{display:flex;justify-content:space-between;border-top:1px solid #edf0f3;padding:8px 0;font-size:13px}.muted{color:#6b7280}.rules{background:#fff;border-radius:16px;padding:15px;margin-top:14px;font-size:13px;line-height:1.5}</style></head><body><header><h1>⚡ EMA Signal Scanner</h1><div class="sub">5M EMA 7 / 17 / 50 / 200 • 15M Trend • RR 1:2 • SIGNAL ONLY</div></header><div class="wrap"><div class="top"><span id="status" class="muted">Loading...</span><button onclick="scan()">Refresh</button></div><div id="grid" class="grid"></div><div class="rules"><b>Assets:</b> BTC • ETH • SOL • GOLD<br><b>SL:</b> previous two candles • <b>Target:</b> 1:2 • No automatic orders.<br><span class="muted">Gold symbol is auto-discovered from Delta's live product list; it is not hard-coded.</span></div></div><script>function n(x){return x==null?'—':Number(x).toLocaleString(undefined,{maximumFractionDigits:4})}function card(k,d){let cls=d.signal==='LONG'?'long':d.signal==='SHORT'?'short':d.signal==='ERROR'||d.signal==='UNAVAILABLE'?'error':'wait';return `<div class="card"><div class="asset">${k} <span class="muted">${d.symbol||''}</span></div><div class="signal ${cls}">${d.signal}</div><div class="row"><span class="muted">15M Trend</span><b>${d.trend||'—'}</b></div>${d.signal==='LONG'||d.signal==='SHORT'?`<div class="row"><span class="muted">Entry</span><b>${n(d.entry)}</b></div><div class="row"><span class="muted">SL</span><b>${n(d.sl)}</b></div><div class="row"><span class="muted">Target 1:2</span><b>${n(d.target)}</b></div>`:''}<div class="row"><span class="muted">Status</span><span>${d.reason||'Confirmed setup'}</span></div></div>`}async function scan(){document.getElementById('status').textContent='Updating...';try{let r=await fetch('/api/scan?x='+Date.now());let j=await r.json();document.getElementById('grid').innerHTML=Object.entries(j.assets).map(x=>card(x[0],x[1])).join('');document.getElementById('status').textContent='Updated '+new Date(j.updated*1000).toLocaleTimeString()}catch(e){document.getElementById('status').textContent='Connection error'}}scan();setInterval(scan,30000);</script></body></html>
